name: Verified function runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/**'
      - 'src/ai_functions/_verified/**'
      - 'src/ai_functions/utils.py'
      - 'tests/test_ai_verified_function.py'
      - 'tests/test_verified_*.py'
      - 'tests/fixtures/verified_*.json'
      - 'examples/verified_*.py'
      - 'pyproject.toml'
      - '.github/workflows/verified-runtime.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-15-intel
          - runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_34_x86_64
          - runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_34_aarch64
    runs-on: ${{ matrix.runner }}
    # Exercise Linux on the same glibc baseline advertised by the wheels.
    container: ${{ matrix.container }}
    env:
      AI_FUNCTIONS_REQUIRE_VERIFIED_RUNTIME: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Prepare the build interpreter
        run: |
          uv python install 3.12 3.13 3.14
          uv venv --python 3.12 --managed-python .venv
          uv pip install --python .venv/bin/python zstandard
      - name: Build the private runtime wheels
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/python runtime/build.py \
            --python .venv/bin/python \
            --python "$(uv python find 3.13)" \
            --python "$(uv python find 3.14)"
      - name: Install and verify on every supported CPython version
        run: |
          for version in 3.12 3.13 3.14; do
            test_env=".venv-test-$version"
            uv venv --python "$version" --managed-python "$test_env"
            uv pip install --python "$test_env/bin/python" \
              --find-links dist/verified-runtime -e '.[verified]' \
              pytest pytest-asyncio hypothesis
            "$test_env/bin/python" -m pytest -q -s \
              tests/test_verified_contracts.py tests/test_verified_compiler.py \
              tests/test_verified_value_types.py tests/test_ai_verified_function.py \
              tests/test_verified_ffi.py
          done
      - name: Preserve runtime wheels and size measurements
        uses: actions/upload-artifact@v4
        with:
          name: verified-runtime-${{ matrix.runner }}
          path: dist/verified-runtime/
